name: RAKSHA Finale CI

on:
  push:
    branches: [finale-v2, finale-ux-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Backend compile
        run: python -m compileall backend
      - name: Finale backend verification
        run: python -m pytest backend/tests/test_finale_smoke.py backend/tests/test_finale_ux_contract.py -q
      - name: Install pinned frontend stack
        run: npm install --prefix frontend
      - name: Make visual stack offline-ready and commit generated lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/index.css')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          if lines and lines[0].startswith('@import url('):
              path.write_text('\n'.join(lines[1:]).lstrip() + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/src/index.css
          git commit -m "chore: lock finale visual stack and remove online font dependency" || true
          git push origin HEAD:finale-ux-rebuild
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: Install Chromium for browser verification
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser judge journey
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 > /tmp/raksha-api.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/raksha-web.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:8001/api/health >/dev/null && curl -fsS http://127.0.0.1:5174 >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/api/health >/dev/null
          curl -fsS http://127.0.0.1:5174 >/dev/null
          npm --prefix frontend run test:e2e
      - name: Create finale ZIP
        run: |
          rm -rf .git .venv node_modules frontend/node_modules backend/data sandbox/database/*.db sandbox/mailbox/*.jsonl sandbox/logs/* || true
          zip -r RAKSHA_FINALE.zip . -x "RAKSHA_FINALE.zip"
      - name: Upload finale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RAKSHA_FINALE
          path: RAKSHA_FINALE.zip
          retention-days: 7
