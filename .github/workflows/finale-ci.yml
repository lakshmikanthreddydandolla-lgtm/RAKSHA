name: RAKSHA Finale CI

on:
  push:
    branches: [finale-v2, finale-ux-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact strict type import fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/workflows/Workflows.tsx')
          text = path.read_text(encoding='utf-8')
          old = "import { FormEvent, useEffect, useMemo, useState } from 'react'"
          new = "import { useEffect, useMemo, useState } from 'react'\nimport type { FormEvent } from 'react'"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          diag = Path('.ci/frontend-build.log')
          if diag.exists():
              diag.unlink()
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/workflows/Workflows.tsx .ci/frontend-build.log || true
            git commit -m "fix: use type-only FormEvent import"
            git push origin HEAD:finale-ux-rebuild
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Backend compile
        run: python -m compileall backend
      - name: Smoke safe invoice
        run: python -m pytest backend/tests/test_finale_smoke.py::test_judge_mode_needs_no_api_key_and_safe_invoice_is_allowed -q
      - name: Smoke context carryover
        run: python -m pytest backend/tests/test_finale_smoke.py::test_demo_agent_preserves_secret_reference_across_turns -q
      - name: Smoke scoped approval
        run: python -m pytest backend/tests/test_finale_smoke.py::test_scoped_allow_applies_only_to_exact_session_scope -q
      - name: Smoke red team
        run: python -m pytest backend/tests/test_finale_smoke.py::test_multi_step_red_team_attack_is_blocked -q
      - name: Smoke tamper evidence
        run: python -m pytest backend/tests/test_finale_smoke.py::test_safe_tamper_demo_detects_copy_change_without_modifying_real_log -q
      - name: Finale UX contracts
        run: python -m pytest backend/tests/test_finale_ux_contract.py -q
      - name: Install frontend
        run: npm install --prefix frontend
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: Create finale ZIP
        run: |
          rm -rf .git .venv node_modules frontend/node_modules backend/data sandbox/database/*.db sandbox/mailbox/*.jsonl sandbox/logs/* || true
          zip -r RAKSHA_FINALE.zip . -x "RAKSHA_FINALE.zip"
      - name: Upload finale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RAKSHA_FINALE
          path: RAKSHA_FINALE.zip
          retention-days: 7
