name: RAKSHA Finale CI

on:
  push:
    branches: [finale-v2, finale-ux-rebuild]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Backend compile
        run: python -m compileall backend
      - name: Finale smoke tests
        run: python -m pytest backend/tests/test_finale_smoke.py -q
      - name: Finale UX contracts
        run: python -m pytest backend/tests/test_finale_ux_contract.py -q
      - name: Install frontend
        run: npm install --prefix frontend
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: Create finale ZIP
        run: |
          rm -rf .git .venv node_modules frontend/node_modules backend/data sandbox/database/*.db sandbox/mailbox/*.jsonl sandbox/logs/* || true
          zip -r RAKSHA_FINALE.zip . -x "RAKSHA_FINALE.zip"
      - name: Upload finale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RAKSHA_FINALE
          path: RAKSHA_FINALE.zip
          retention-days: 7
