name: RAKSHA Finale CI

on:
  push:
    branches: [finale-v2, finale-ux-rebuild]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Backend compile
        run: python -m compileall backend
      - name: Smoke safe invoice
        run: python -m pytest backend/tests/test_finale_smoke.py::test_judge_mode_needs_no_api_key_and_safe_invoice_is_allowed -q
      - name: Smoke context carryover
        run: python -m pytest backend/tests/test_finale_smoke.py::test_demo_agent_preserves_secret_reference_across_turns -q
      - name: Smoke scoped approval
        run: python -m pytest backend/tests/test_finale_smoke.py::test_scoped_allow_applies_only_to_exact_session_scope -q
      - name: Smoke red team
        run: python -m pytest backend/tests/test_finale_smoke.py::test_multi_step_red_team_attack_is_blocked -q
      - name: Smoke tamper evidence
        run: python -m pytest backend/tests/test_finale_smoke.py::test_safe_tamper_demo_detects_copy_change_without_modifying_real_log -q
      - name: Finale UX contracts
        run: python -m pytest backend/tests/test_finale_ux_contract.py -q
      - name: Install frontend
        run: npm install --prefix frontend
      - name: Frontend production build
        id: frontend_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix frontend run build 2>&1 | tee frontend-build.log
      - name: Compiler check App.tsx
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "src/App.tsx" frontend-build.log'
      - name: Compiler check Workflows.tsx
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "src/workflows/Workflows.tsx" frontend-build.log'
      - name: Compiler check RakshaCore.tsx
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "src/scene/RakshaCore.tsx" frontend-build.log'
      - name: Compiler check api.ts
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "src/api.ts" frontend-build.log'
      - name: Compiler check index.css
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "src/index.css" frontend-build.log'
      - name: Compiler check App.css
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "src/App.css" frontend-build.log'
      - name: Compiler check tsconfig.app
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "tsconfig.app" frontend-build.log'
      - name: Compiler check tsconfig.node
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "tsconfig.node" frontend-build.log'
      - name: Compiler check vite config
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -q "vite.config" frontend-build.log'
      - name: Compiler check missing module
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -qi "Cannot find module\|Could not resolve\|Cannot find type definition" frontend-build.log'
      - name: Compiler check CSS parser
        if: steps.frontend_build.outcome == 'failure'
        continue-on-error: true
        run: '! grep -qi "css\|Unknown word\|Unexpected token\|Parse error" frontend-build.log'
      - name: Upload frontend diagnostics
        if: steps.frontend_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-diagnostics
          path: frontend-build.log
          retention-days: 1
      - name: Fail on frontend build error
        if: steps.frontend_build.outcome == 'failure'
        run: exit 1
      - name: Create finale ZIP
        run: |
          rm -rf .git .venv node_modules frontend/node_modules backend/data sandbox/database/*.db sandbox/mailbox/*.jsonl sandbox/logs/* || true
          zip -r RAKSHA_FINALE.zip . -x "RAKSHA_FINALE.zip"
      - name: Upload finale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RAKSHA_FINALE
          path: RAKSHA_FINALE.zip
          retention-days: 7
